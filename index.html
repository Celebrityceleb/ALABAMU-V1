<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ALABAMU Admin</title>

    <link
        rel="stylesheet"
        href="admin.css"
    >

</head>


<body class="admin-login-page">


    <main class="admin-login-container">


        <section class="admin-login-card">


            <div class="admin-brand">

                <div class="admin-brand-mark">
                    A
                </div>

                <div>

                    <p>
                        ALABAMU
                    </p>

                    <span>
                        ADMIN
                    </span>

                </div>

            </div>


            <div class="admin-login-heading">

                <p class="admin-eyebrow">
                    PRIVATE ACCESS
                </p>

                <h1>
                    ADMIN LOGIN
                </h1>

                <p>
                    Sign in to manage the ALABAMU store.
                </p>

            </div>


            <form id="adminLoginForm">


                <div class="admin-field">

                    <label for="adminEmail">
                        EMAIL
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Admin email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="admin-field">

                    <label for="adminPassword">
                        PASSWORD
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Admin password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="admin-primary-button"
                    id="adminLoginButton"
                >
                    SIGN IN
                </button>


                <p
                    id="adminLoginMessage"
                    class="admin-message"
                ></p>


            </form>


        </section>


    </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
    if (!window.supabase || !window.supabase.createClient) {
        console.error(
            "ALABAMU ADMIN: Supabase library failed to load.",
            window.supabase
        );
    } else {
        const ADMIN_SUPABASE_URL =
            "https://snfhtyznypoukxmhetkl.supabase.co";

        const ADMIN_SUPABASE_KEY =
            "sb_publishable_Fat6XU5USrik_wEtT0mRfQ_ZcQM-cej";

        window.supabaseClient =
            window.supabase.createClient(
                ADMIN_SUPABASE_URL,
                ADMIN_SUPABASE_KEY,
                {
                    auth: {
                        persistSession: true,
                        autoRefreshToken: true,
                        detectSessionInUrl: true,
                        storageKey: "alabamu-admin-auth"
                    }
                }
            );

        console.log(
            "ALABAMU ADMIN: Supabase client initialized."
        );
    }
</script>

<script src="admin.js"></script>

    


</body>

</html>
