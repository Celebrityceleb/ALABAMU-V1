<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cart | ALABAMU</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- HEADER -->

    <header class="site-header">

        <a
            href="index.html"
            class="brand-logo"
            aria-label="ALABAMU Home"
        >

            <svg
                class="brand-mark"
                viewBox="0 0 32 24"
                aria-hidden="true"
            >

                <path
                    d="M3 18
                       L7 7
                       L10 12
                       L16 3
                       L22 12
                       L25 7
                       L29 18
                       L24 18
                       L22 14
                       L19 18
                       L13 18
                       L10 14
                       L8 18
                       Z"
                    fill="currentColor"
                />

            </svg>

            <span class="brand-name">
                ALABAMU
            </span>

        </a>


        <!-- DESKTOP NAVIGATION -->

        <nav class="main-nav">

            <a
                href="index.html#home"
                class="nav-link"
            >
                Home
            </a>

            <a
                href="index.html#shop"
                class="nav-link"
            >
                Shop
            </a>

            <a
                href="index.html#about"
                class="nav-link"
            >
                About
            </a>

        </nav>


        <!-- HEADER ACTIONS -->

        <div class="header-actions">

            <button
                type="button"
                class="icon-button"
                id="searchButton"
                aria-label="Search ALABAMU"
            >
                ⌕
            </button>


            <button
                type="button"
                class="icon-button"
                id="accountButton"
                aria-label="Account"
            >
                ♙
            </button>


            <a
                href="cart.html"
                class="cart-button"
                aria-label="Shopping cart"
            >

                <span
                    class="cart-icon"
                    aria-hidden="true"
                >
                    🛒
                </span>

                <span id="cartCount">
                    0
                </span>

            </a>


            <button
                type="button"
                class="menu-button"
                id="menuButton"
                aria-label="Open menu"
                aria-expanded="false"
            >
                ☰
            </button>

        </div>

    </header>



    <!-- MOBILE MENU -->

    <div
        class="mobile-menu"
        id="mobileMenu"
    >

        <a href="index.html#home">
            Home
        </a>

        <a href="index.html#shop">
            Shop
        </a>

        <a href="index.html#about">
            About
        </a>

        <button
            type="button"
            id="mobileAccountButton"
        >
            Account
        </button>

        <a href="cart.html">
            Cart
        </a>

    </div>



    <!-- CART -->

    <main class="cart-page">

        <div class="cart-container">

            <div class="cart-heading">

                <p class="product-category">
                    ALABAMU
                </p>

                <h1>
                    YOUR CART
                </h1>

            </div>


            <!-- CART ITEMS -->

            <div
                id="cartItems"
                class="cart-items"
            >

                <!-- JavaScript inserts cart items here -->

            </div>


            <!-- CART SUMMARY -->

            <div
                id="cartSummary"
                class="cart-summary"
            >

                <div class="cart-total-row">

                    <span>
                        Total
                    </span>

                    <strong id="cartTotal">
                        ₦0
                    </strong>

                </div>


                <button
                    type="button"
                    class="primary-button"
                    id="checkoutButton"
                >
                    PROCEED TO CHECKOUT
                </button>

            </div>

        </div>

    </main>



    <!-- FOOTER -->

    <footer class="site-footer">

        <div class="footer-brand">
            ALABAMU
        </div>

        <p>
            Dream. Create. Wear Different.
        </p>

        <p class="footer-copy">
            © 2026 ALABAMU. All rights reserved.
        </p>

    </footer>


    <script src="js/app.js"></script>

</body>

</html>
