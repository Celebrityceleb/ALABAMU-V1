
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password — ALABAMU</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="auth-page">
        <div class="auth-container">

            <div class="login-brand">ALABAMU</div>

            <p class="eyebrow">CUSTOMER ACCOUNT</p>

            <h1>RESET PASSWORD</h1>

            <p id="resetMessage" class="placeholder-text" role="status" aria-live="polite">
                Verifying your password reset link...
            </p>

            <form id="resetPasswordForm">
                <label for="newPassword">
                    New Password
                    <input
                        type="password"
                        id="newPassword"
                        autocomplete="new-password"
                        placeholder="Enter new password"
                        minlength="6"
                        required
                    >
                </label>

                <label for="confirmNewPassword">
                    Confirm New Password
                    <input
                        type="password"
                        id="confirmNewPassword"
                        autocomplete="new-password"
                        placeholder="Confirm new password"
                        minlength="6"
                        required
                    >
                </label>

                <button
                    type="submit"
                    class="primary-button"
                    id="resetPasswordButton"
                >
                    UPDATE PASSWORD
                </button>
            </form>

            <a
                href="index.html"
                class="secondary-button"
                style="display:block; text-align:center; margin-top:12px;"
            >
                BACK TO ALABAMU
            </a>

        </div>
    </main>

    <!-- Load Supabase library first -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Initialize the shared client -->
    <script src="js/supabase.js"></script>

    <!-- Load the reset handler after initialization -->
    <script type="module" src="js/reset-password.js"></script>

</body>
</html>
